<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
    <link rel="contactstyle" href="Css/contact.css" />
    <script src="Java/contact.js"></script>
    <script type="text/javascript" src="https://form.jotform.com/jsform/253337984025866"></script>

</head>
<body>
  <button onclick="goBack()">Go Back</button>

  <form id="contactForm">
    <fieldset>
      <legend>Contact Us</legend>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required placeholder="Your full name" title="Enter your name" />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" title="Enter your email" />

      <label for="message">Message:</label>
      <textarea id="message" name="message" required placeholder="Your message here..." title="Enter your message"></textarea>

      <button type="submit">Send</button>
    </fieldset>
  </form>

 
</body>
</html>
